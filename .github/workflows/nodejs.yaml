name: Deploy to Heroku

on:
  push:
    branches:
      - main  # Trigger the deployment when changes are pushed to the 'main' branch.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository.
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up Node.js environment.
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'  # Use the Node.js version that matches your project.

    # Step 3: Install dependencies.
    - name: Install dependencies
      run: npm install

    # Step 4: Run tests (Optional but recommended to ensure the app is stable before deploying).
    - name: Run tests
      run: npm test

    # Step 5: Deploy to Heroku using the Heroku API key from GitHub Secrets.
    # - name: Deploy to Heroku
    #   env:
    #     HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    #   run: |
    #     git remote add heroku https://heroku:${{ secrets.HEROKU_API_KEY }}@git.heroku.com/YOUR_HEROKU_APP_NAME.git
    #     git push heroku main
